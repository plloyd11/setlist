<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Setlist — build, time, and share setlists with your band." />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8eff5" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080c13" />
		<script>
			(function () {
				const theme = localStorage.getItem('theme');
				if (
					theme === 'dark' ||
					(!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
